services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eventhub_test
      POSTGRES_USER: eventhub
      POSTGRES_PASSWORD: eventhub
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventhub -d eventhub_test"]
      interval: 2s
      timeout: 3s
      retries: 15
