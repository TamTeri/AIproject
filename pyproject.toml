[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "eventhub"
version = "0.1.0"
description = "EventHub greenfield Flask bootstrap"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "Flask>=3.1,<4",
  "Flask-SQLAlchemy>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
]

[project.scripts]
eventhub = "app.config.commands:main"
eventhub-migrate = "app.config.commands:migrate"
eventhub-reset = "app.config.commands:reset"
eventhub-seed = "app.config.commands:seed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["app*"]
