[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "eventhub"
version = "0.1.0"
description = "EventHub ticketing web application (CEN 4020 AI project)"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "Flask>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "ruff>=0.6",
  "pre-commit>=3.7",
  # Part 5 system tests: a real browser via Selenium, and an HTML report
  "selenium>=4.20,<5",
  "pytest-html>=4.1,<5",
]

[project.scripts]
eventhub = "app.config.commands:main"
eventhub-migrate = "app.config.commands:migrate"
eventhub-reset = "app.config.commands:reset"
eventhub-seed = "app.config.commands:seed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# System tests (Selenium) are left out of a plain `pytest` run; run them with
# `python scripts/run_system_tests.py` (or `pytest -m system tests/system`).
addopts = "-ra --import-mode=importlib -m 'not system'"
# xunit1 keeps record_property values (requirements, performance numbers) in the JUnit XML.
junit_family = "xunit1"
markers = [
  "postgres: needs a real PostgreSQL (EVENTHUB_TEST_DATABASE_URL); skipped otherwise",
  "system: Selenium system test through a real browser (scripts/run_system_tests.py)",
  "whitebox: system test designed from knowledge of the code (the rest are black-box)",
  "performance: load test against the system-013 performance target",
  "requirement(*ids): the requirement ids (features/*/requirements.md) a test proves",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# E/F/W: errors and obvious mistakes, I: import order, B: likely bugs, UP: modern syntax
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # long SQL strings and test tables; ruff format handles code lines

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B017"]
