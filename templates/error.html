{% extends "base.html" %}
{# system-027 (Part 7): every visible text is a catalog key (app/i18n/<lang>.json). #}
{% block title %}EventHub{% endblock %}
{% block content %}
<section class="error" role="alert" data-error-code="{{ error.code }}">
  <h1>{{ _('error_title') }}</h1>
  <p>{{ error.message }}</p>
</section>
<p><a href="{{ url_for('web.events') }}">{{ _('error_back') }}</a></p>
{% endblock %}
