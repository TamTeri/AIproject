{% extends "base.html" %}
{% block title %}EventHub error{% endblock %}
{% block content %}
<section class="error" role="alert" data-error-code="{{ error.code }}">

</section>
<p><a href="{{ url_for('web.events') }}">Return to events</a></p>
{% endblock %}
