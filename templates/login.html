{% extends "base.html" %}
{% block title %}Log in · EventHub{% endblock %}
{% block content %}
<h1>Log in</h1>
{% if expired %}<p class="message" role="status">Your session expired. Please log in again.</p>{% endif %}
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form class="stack" method="post" action="{{ url_for('web.login_submit') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  {% if next_target %}<input type="hidden" name="next" value="{{ next_target }}">{% endif %}
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="username" value="{{ email or '' }}" required>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Log in</button>
</form>
<p><a href="{{ url_for('web.register') }}">Need an account? Register</a></p>
{% endblock %}
