{% extends "base.html" %}
{% block title %}Log in · EventHub{% endblock %}
{% block content %}
<h1>Log in</h1>
<form method="post" action="{{ url_for('web.login_submit') }}">
  {% if next_target %}<input type="hidden" name="next" value="{{ next_target }}">{% endif %}
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="username" required>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Log in</button>
</form>
<p><a href="{{ url_for('web.register') }}">Need an account? Register</a></p>
{% endblock %}
