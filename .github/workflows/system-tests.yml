# Part 5 / Call 5: the Selenium system tests run on every code change, and at
# the press of a button: GitHub -> Actions -> "System tests" -> "Run workflow".
# The HTML report (with a screenshot for every failure) is attached to each run.
name: System tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      keyword:
        description: "Only tests matching this pytest -k expression (leave empty for all)"
        required: false
        default: ""

jobs:
  selenium:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eventhub_test
          POSTGRES_USER: eventhub
          POSTGRES_PASSWORD: eventhub
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U eventhub -d eventhub_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      EVENTHUB_TEST_DATABASE_URL: postgresql+psycopg://eventhub:eventhub@localhost:55432/eventhub_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'
      - name: Chrome version (preinstalled on ubuntu-latest)
        run: google-chrome --version
      - name: Run the system tests (Selenium + headless Chrome)
        env:
          KEYWORD: ${{ inputs.keyword }}
        run: |
          if [ -n "$KEYWORD" ]; then
            python scripts/run_system_tests.py --no-docker -k "$KEYWORD"
          else
            python scripts/run_system_tests.py --no-docker
          fi
      - name: Fail if any system test was skipped (system-018)
        if: inputs.keyword == ''
        run: python scripts/fail_on_skips.py reports/system-tests.xml
      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-test-report
          path: reports/
          if-no-files-found: warn
