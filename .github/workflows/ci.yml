# The automatic run has the final say (Call 4): if it fails, the change does
# not go in. Protect `main` in GitHub settings and require this check.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eventhub_test
          POSTGRES_USER: eventhub
          POSTGRES_PASSWORD: eventhub
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U eventhub -d eventhub_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      EVENTHUB_TEST_DATABASE_URL: postgresql+psycopg://eventhub:eventhub@localhost:55432/eventhub_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'
      - name: Lint (obvious errors)
        run: ruff check .
      - name: Style
        run: ruff format --check .
      - name: Spec alignment (warning only)
        if: github.event_name == 'pull_request'
        run: python scripts/check_spec_alignment.py --base origin/${{ github.base_ref }}
      - name: Every testable requirement is named by a test (Call 5)
        run: python scripts/check_requirement_coverage.py --strict
      - name: All tests against real PostgreSQL
        run: python -m pytest -q --junitxml=reports/junit.xml
      - name: Fail if anything was skipped or nothing ran (system-018)
        run: python scripts/fail_on_skips.py reports/junit.xml
      - name: Migrations round-trip (downgrade one step, upgrade to head)
        # The alembic CLI has no URL of its own here, so build the config the app uses.
        run: |
          python - <<'PY'
          import os
          from alembic import command
          from app.config.database import alembic_config
          cfg = alembic_config(database_url=os.environ["EVENTHUB_TEST_DATABASE_URL"])
          command.upgrade(cfg, "head")
          command.downgrade(cfg, "-1")  # alembic downgrade -1
          command.upgrade(cfg, "head")  # alembic upgrade head
          PY
